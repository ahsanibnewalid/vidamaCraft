name: Extractor Sandbox Build

on:
  pull_request:
    paths:
      - "extractor-sandbox/**"
      - ".github/workflows/extractor-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extractor-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-sandbox:
    name: Compile isolated Android sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Assemble debug APK
        run: gradle -p extractor-sandbox :app:assembleDebug --stacktrace

      - name: Report APK size
        run: ls -lh extractor-sandbox/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload sandbox APK
        uses: actions/upload-artifact@v4
        with:
          name: vidamacraft-extractor-sandbox-debug
          path: extractor-sandbox/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
